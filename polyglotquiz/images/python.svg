<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0f2a3a"/>
  <rect x="40" y="40" width="560" height="280" rx="12" fill="#12384f" stroke="#2f7ea8" stroke-width="2"/>
  <rect x="70" y="112" width="6" height="120" fill="#ffd43b" opacity="0.8"/>
  <rect x="110" y="152" width="6" height="40" fill="#4fc3f7" opacity="0.8"/>
  <g font-family="Courier New, monospace" font-size="26" fill="#e6f4ff">
    <text x="90" y="90" fill="#ffd43b">def fatorial(n):</text>
    <text x="130" y="135">if n &lt;= 1:</text>
    <text x="170" y="180" fill="#7ee787">return 1</text>
    <text x="130" y="225">return n * fatorial(n - 1)</text>
  </g>
  <text x="90" y="290" font-family="Courier New, monospace" font-size="18" fill="#9fc9e0">Aqui, o espaço em branco faz parte da sintaxe.</text>
</svg>
